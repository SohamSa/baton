name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pack the engine for the browser
        run: python scripts/stage_browser_engine.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the site
        working-directory: apps/web
        run: npm ci && npm run build
        env:
          VITE_PUBLIC_DEMO: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
